# PostgreSQL para desarrollo local: `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: egt
      POSTGRES_PASSWORD: egt
      POSTGRES_DB: egt
    ports:
      - "5432:5432"
    volumes:
      - datos-egt:/var/lib/postgresql/data

volumes:
  datos-egt:
